app-id: io.github.eqonomize.eqonomize
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: eqonomize
rename-desktop-file: eqonomize.desktop
rename-icon: eqonomize
copy-icon: true
finish-args:
  - --device=dri
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # Network access
  # for exchange rates updates
  - --share=network
modules:

  - name: eqonomize
    buildsystem: qmake
    sources:
      - type: archive
        url: https://github.com/Eqonomize/eqonomize/releases/download/v1.5.13/eqonomize-1.5.13.tar.gz
        sha256: a09c94db58bd938caaffc06a1e83dadcaa98777840461ee843605eaa6ce971fb
